<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting&hellip;</title>

  <!-- Method 1: Meta refresh (works without JavaScript) -->
  <meta http-equiv="refresh" content="0; url=https://variantminds.au/nosocials">

  <!-- Tell search engines the real home of this content -->
  <link rel="canonical" href="https://variantminds.au/nosocials">
  <meta name="robots" content="noindex">

  <!-- Method 2: JavaScript redirect, immediate -->
  <script>
    // location.replace() avoids polluting browser history with this page
    window.location.replace("https://variantminds.au/nosocials");
  </script>
</head>
<body>
  <!-- Method 3: JS fallback on load, in case the inline script was blocked mid-parse -->
  <script>
    window.addEventListener("load", function () {
      window.location.href = "https://variantminds.au/nosocials";
    });
  </script>

  <!-- Method 4: Manual fallback link if everything else fails -->
  <p>
    Redirecting to
    <a href="https://variantminds.au/nosocials">variantminds.au/nosocials</a>&hellip;
    If you are not redirected automatically, follow the link.
  </p>
</body>
</html>
